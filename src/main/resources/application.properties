spring.application.name=docker-lab

app.message=${APP_MESSAGE:Hello from Docker Compose}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s


management.endpoints.web.exposure.include=health,metrics

# Faqat laboratoriya load testi uchun
lab.product.read-delay-ms=0

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId}] [traceId=%X{traceId}] [spanId=%X{spanId}] %logger{36} - %msg%n

# 513-dars
lab.jobs.timing-demo-enabled=false

lab.jobs.warmup-enabled=false
lab.jobs.warmup-product-ids=1,3,5

lab.jobs.warmup-initial-delay-ms=10000
lab.jobs.warmup-delay-ms=30000

payment.base-url=${PAYMENT_BASE_URL:http://localhost:8090}

spring.main.web-application-type=servlet

payment.lookup.total-timeout-ms=8000

management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# 521-DARS ? Spring Events Lab
lab.events.fail-notification=false

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitlab}
spring.rabbitmq.password=${RABBITMQ_PASS:rabbitlab123}
spring.rabbitmq.virtual-host=/

# 525-dars: bir nechta consumer bilan
# ishni murakkablashtirmaslik uchun
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1


# 526-DARS ? Consumer failure handling
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=2
spring.rabbitmq.listener.simple.auto-startup=true

# Retry'ni consumer kodining o'zida bajaramiz
spring.rabbitmq.listener.simple.retry.enabled=false


# ======================================
# 530-DARS ? Spring Kafka
# ======================================

# Kafka broker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ======================================
# PRODUCER
# ======================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.acks=all

# JSON'ga Java class headerlarini qo'shmaymiz
spring.kafka.producer.properties[spring.json.add.type.headers]=false


# ======================================
# CONSUMER
# ======================================

spring.kafka.consumer.group-id=kafka-notification-530-lab

spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=uz.demo.dockerlab.kafkalab.OrderCreatedMessage

spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.kafka.consumer.properties[spring.json.trusted.packages]=uz.demo.dockerlab.kafkalab


# ======================================
# LISTENER
# ======================================

spring.kafka.listener.ack-mode=record

spring.kafka.listener.concurrency=1

# ======================================
# 535-DARS ? Inventory Consumer
# ======================================

lab.kafka.inventory.concurrency=${KAFKA_INVENTORY_CONCURRENCY:1}

# Lab control endpointlari default o?chiq
lab.kafka.controls-enabled=${LAB_KAFKA_CONTROLS_ENABLED:false}

# ======================================
# 536-DARS ? Optimistic Locking Lab
# ======================================
lab.locking.enabled=${LAB_LOCKING_ENABLED:false}
logging.level.org.hibernate.SQL=DEBUG

# ========================================
# 539-DARS ? HTTP Idempotency Lab
# ========================================
lab.idempotency.enabled=${LAB_IDEMPOTENCY_ENABLED:false}

# ========================================
# 540-DARS ? Idempotent Kafka Consumer
# ========================================
lab.kafka.idempotent-enabled=${LAB_KAFKA_IDEMPOTENT_ENABLED:false}

# =======================================
# 541-DARS ? Distributed Transaction Lab
# =======================================
lab.distributed.enabled=${LAB_DISTRIBUTED_ENABLED:false}

lab.saga.enabled=${LAB_SAGA_ENABLED:false}

lab.outbox.poll-ms=3000


lab.saga544.enabled=${LAB_SAGA544_ENABLED:false}
lab.outbox.enabled=${LAB_OUTBOX_ENABLED:false}

# 545-DARS ? File Upload Fundamentals
lab.file-upload.enabled=${LAB_FILE_UPLOAD_ENABLED:false}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# ========================================
# 546-DARS - MinIO Object Storage
# ========================================
lab.storage.bucket=docker-lab-files

lab.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
lab.storage.access-key=${MINIO_ACCESS_KEY}
lab.storage.secret-key=${MINIO_SECRET_KEY}

# ======================================
# 548-DARS
# ======================================
lab.batch.enabled=${LAB_BATCH_ENABLED:false}


# ======================================
# 549-DARS - Product CSV Import
# ======================================
lab.batch549.enabled=${LAB_BATCH549_ENABLED:false}

lab.batch549.input-file=${LAB_BATCH549_INPUT_FILE:file:/batch-data/products.csv}
lab.batch549.chunk-size=${LAB_BATCH549_CHUNK_SIZE:1000}
lab.batch549.fail-at-id=${LAB_BATCH549_FAIL_AT_ID:0}

# Batch Job startup
spring.batch.job.enabled=${LAB_BATCH549_ENABLED:false}

# Birinchi marta schema yaratishda "always";
# mavjud schema uchun "never"
spring.batch.jdbc.initialize-schema=never