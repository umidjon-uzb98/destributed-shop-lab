
name: Docker Lab - CI and Docker Image

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-image:
    name: Build, Test and Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      # 1. Source code
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compile + Test + Package
      - name: Maven clean verify
        run: mvn -B -ntp clean verify

      # 4. JAR artifact
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: docker-lab-jar-${{ github.sha }}
          path: target/docker-lab-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      # 5. Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. Docker image tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # 7. GHCR login - only main push
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Docker image build + conditional push
      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
